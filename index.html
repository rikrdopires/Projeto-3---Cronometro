<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógico + Cronômetro + Pomodoro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <!-- Sessão Relótigo -->
        <section class="relogio">
            <h1 id="hora-atual">00:00:00</h1>

        </section>

        <!-- Sessão Cronômetro -->
        <section class="cronometro">
            <h2 id="display-cronometro">00:00:00</h2>
            <div class="botoes-cronometro">
                <button id="btn-iniciar">Iniciar</button>
                <button id="btn-pausar">Pausar</button>
                <button id="btn-zerar">Zerar</button>
            </div>
        </section>


        <!-- Sessão Pomodoro -->
    </main>

        <section class="pomodoro">
            <h2 id="display-pomodoro">25:00</h2>
            <div class="botoes-pomodoro">
                <button id="btn-foco">Foco</button>
                <button id="btn-pausa">Pausa</button>
            </div>
        </section>

    <script src="script.js"></script>
</body>

</html>
